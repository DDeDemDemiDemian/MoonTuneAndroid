
name: Build MoonTune APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          unzip -q MoonTune_Source_Files.zip -d extracted
          test -f extracted/MoonTuneAndroid/app/build.gradle.kts

      - name: Fix fpcalc dependency coordinate
        run: |
          sed -i 's/com\.github\.QuickLyric:fpcalc-android/com.github.quicklyric:fpcalc-android/g' extracted/MoonTuneAndroid/app/build.gradle.kts
          grep -n 'fpcalc-android' extracted/MoonTuneAndroid/app/build.gradle.kts

      - name: Build APK
        working-directory: extracted/MoonTuneAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moontune-debug-apk
          path: extracted/MoonTuneAndroid/app/build/outputs/apk/debug/app-debug.apk
