
name: Build MoonTune APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          unzip -q MoonTune_Source_Files.zip -d extracted
          test -f extracted/MoonTuneAndroid/app/build.gradle.kts

            - name: Fix fingerprint dependency
        run: |
          FILE="extracted/MoonTuneAndroid/app/build.gradle.kts"
          sed -i -E 's/com\.github\.(QuickLyric|quicklyric):fpcalc-android:[^") ]+/com.github.QuickLyric:fpcalc-android:master-SNAPSHOT/g' "$FILE"
          grep -n 'fpcalc-android' "$FILE"
          
      - name: Build debug APK
        working-directory: extracted/MoonTuneAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoonTune-debug-APK
          path: extracted/MoonTuneAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
